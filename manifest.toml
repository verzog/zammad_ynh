packaging_format = 2

id = "zammad"
name = "Zammad"
description.en = "Customer support and helpdesk ticketing system"
description.fr = "Système de support client et gestion de tickets"

version = "7.2.2~ynh1"

maintainers = ["verzog"]

[upstream]
license = "AGPL-3.0"
website = "https://zammad.org"
demo = "https://zammad.org/demo"
userdoc = "https://docs.zammad.org"
code = "https://github.com/zammad/zammad"
cpe = "cpe:2.3:a:zammad:zammad"

[integration]
# helpers_version 2.1 is only available from YunoHost 11.2.29 onward (and is the
# default on YunoHost 12), so the minimum must match.
yunohost = ">= 11.2.29"
helpers_version = "2.1"
architectures = ["amd64"]
multi_instance = false
ldap = true
sso = false
# Zammad pulls in PostgreSQL, Redis, Ruby/Rails and Elasticsearch; the on-disk
# footprint and memory needs are substantial (see doc/DISCLAIMER.md).
disk = "5G"
ram.build = "2048M"
ram.runtime = "1024M"

[install]

    [install.domain]
    type = "domain"

    [install.init_main_permission]
    help.en = "Who can access Zammad. Choose 'visitors' for a public helpdesk."
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.language]
    ask.en = "Choose the application language"
    type = "select"
    choices = ["en", "de", "fr", "es", "it", "nl", "pl", "pt", "ru", "zh"]
    default = "en"

[resources]

    # No system_user, install_dir, or data_dir resources — Zammad's own Debian
    # package creates the 'zammad' system user, /opt/zammad, and /var/lib/zammad
    # with the exact settings it needs. Pre-creating them via YunoHost conflicts
    # with the package's postinst and causes 'can't cd to /opt/zammad' failures.

    [resources.permissions]
    main.url = "/"
    main.auth_header = false

    # API must always be reachable by visitors regardless of main permission
    # so Zammad's own frontend JS (and API clients) are never blocked by SSOwat.
    # Zammad enforces its own token/session auth on every API call.
    api.url = "/api"
    api.auth_header = false
    api.allowed = "visitors"
    api.show_tile = false
    api.protected = true

    [resources.ports]
    main.default = 3000
    websocket.default = 6042
